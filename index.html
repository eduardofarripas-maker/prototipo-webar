
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>A ilustração ganha vida | WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #fbe8e5;
    }

    #interface {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 35px 20px;
      pointer-events: none;
    }

    #topo {
      text-align: center;
      color: #26364b;
      background: rgba(255,255,255,0.88);
      padding: 14px 22px;
      border-radius: 18px;
      max-width: 330px;
    }

    #topo h1 {
      font-size: 20px;
      margin: 0 0 6px;
    }

    #topo p {
      font-size: 13px;
      margin: 0;
    }

    #mensagem {
      background: rgba(255,255,255,0.92);
      color: #26364b;
      border-radius: 20px;
      padding: 12px 18px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 15px;
    }

    #iniciar {
      pointer-events: auto;
      background: #f45b43;
      color: white;
      border: none;
      padding: 17px 35px;
      border-radius: 35px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    #iniciar:disabled {
      opacity: 0.6;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .escondido {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- Interface -->
  <div id="interface">

    <div id="topo">
      <h1>A ilustração ganha vida</h1>
      <p>Uma experiência de realidade aumentada</p>
    </div>

    <div style="text-align:center;">
      <div id="mensagem">
        Carrega em iniciar e aponta a câmara para a ilustração.
      </div>

      <button id="iniciar">
        INICIAR EXPERIÊNCIA
      </button>
    </div>

  </div>

  <!-- Recursos -->
  <a-scene
    mindar-image="
      imageTargetSrc: ./assets/target.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets>
      <img
        id="originalImage"
        src="./assets/ilustracao.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- IMAGEM DE REFERÊNCIA E ANIMAÇÕES -->
    <a-entity
      id="imageTarget"
      mindar-image-target="targetIndex: 0"
    >

      <!-- Ilustração original -->
      <a-plane
        src="#originalImage"
        width="1"
        height="0.7133"
        position="0 0 0"
        material="shader: flat; side: double"
      ></a-plane>

      <!-- Estrela esquerda -->
      <a-entity
        geometry="primitive: tetrahedron; radius: 0.035"
        material="color: #ffad21; shader: flat"
        position="-0.34 0.23 0.025"
        animation__float="
          property: position;
          to: -0.34 0.28 0.025;
          dur: 1800;
          dir: alternate;
          loop: true;
          easing: easeInOutSine
        "
        animation__rotate="
          property: rotation;
          to: 0 0 360;
          dur: 5000;
          loop: true;
          easing: linear
        "
      ></a-entity>

      <!-- Estrela direita -->
      <a-entity
        geometry="primitive: tetrahedron; radius: 0.028"
        material="color: #f45b43; shader: flat"
        position="0.34 0.25 0.025"
        animation__float="
          property: position;
          to: 0.34 0.20 0.025;
          dur: 2200;
          dir: alternate;
          loop: true
        "
        animation__rotate="
          property: rotation;
          to: 0 0 -360;
          dur: 6000;
          loop: true;
          easing: linear
        "
      ></a-entity>

      <!-- Esfera esquerda -->
      <a-sphere
        radius="0.022"
        color="#f7b53c"
        position="-0.43 -0.12 0.03"
        animation="
          property: position;
          to: -0.43 -0.17 0.03;
          dur: 1600;
          dir: alternate;
          loop: true
        "
      ></a-sphere>

      <!-- Esfera central -->
      <a-sphere
        radius="0.025"
        color="#f47b70"
        position="0 -0.24 0.03"
        animation="
          property: position;
          to: 0 -0.19 0.03;
          dur: 1900;
          dir: alternate;
          loop: true
        "
      ></a-sphere>

      <!-- Esfera direita -->
      <a-sphere
        radius="0.018"
        color="#f7b53c"
        position="0.43 -0.12 0.03"
        animation="
          property: position;
          to: 0.43 -0.16 0.03;
          dur: 1400;
          dir: alternate;
          loop: true
        "
      ></a-sphere>

      <!-- Arco esquerdo -->
      <a-torus
        radius="0.055"
        radius-tubular="0.008"
        arc="180"
        color="#f47b70"
        position="-0.30 -0.29 0.035"
        rotation="0 0 0"
        animation="
          property: rotation;
          to: 0 0 15;
          dur: 2000;
          dir: alternate;
          loop: true
        "
      ></a-torus>

      <!-- Arco direito -->
      <a-torus
        radius="0.055"
        radius-tubular="0.008"
        arc="180"
        color="#f47b70"
        position="0.30 -0.29 0.035"
        animation="
          property: rotation;
          to: 0 0 -15;
          dur: 2000;
          dir: alternate;
          loop: true
        "
      ></a-torus>

      <!-- Pequena estrela central -->
      <a-entity
        geometry="primitive: tetrahedron; radius: 0.018"
        material="color: #ffad21; shader: flat"
        position="0 0.32 0.03"
        animation="
          property: scale;
          to: 1.5 1.5 1.5;
          dur: 1000;
          dir: alternate;
          loop: true
        "
      ></a-entity>

    </a-entity>

  </a-scene>

  <!-- Controlos da experiência -->
  <script>
    const botao = document.querySelector("#iniciar");
    const mensagem = document.querySelector("#mensagem");
    const interfaceAR = document.querySelector("#interface");
    const cena = document.querySelector("a-scene");
    const alvo = document.querySelector("#imageTarget");

    let iniciada = false;

    alvo.addEventListener("targetFound", () => {
      mensagem.textContent = "Ilustração reconhecida! Aproveita a experiência.";
    });

    alvo.addEventListener("targetLost", () => {
      mensagem.textContent = "Aponta novamente para a ilustração.";
    });

    botao.addEventListener("click", async () => {

      if (iniciada) return;

      botao.disabled = true;
      mensagem.textContent = "A iniciar a câmara...";

      try {
        const sistema = cena.systems["mindar-image"];

        await sistema.start();

        iniciada = true;
        mensagem.textContent = "Procura a ilustração com a câmara.";
        botao.classList.add("escondido");

      } catch (erro) {
        console.error("Erro ao iniciar AR:", erro);

        mensagem.textContent =
          "Não foi possível iniciar a câmara. Verifica as permissões e tenta novamente.";

        botao.disabled = false;
      }

    });
  </script>

</body>
</html>
