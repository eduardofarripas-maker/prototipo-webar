<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#fbe8e5">
  <title>A ilustração ganha vida | WebAR</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <main class="intro" id="intro">
    <div class="intro-card">
      <p class="eyebrow">EXPERIÊNCIA WEBAR</p>
      <h1>A ilustração ganha vida</h1>
      <p>Permita o acesso à câmara e aponte o telemóvel para a ilustração.</p>
      <button id="startButton">Iniciar experiência</button>
      <p class="small">Não é necessária uma aplicação. Utilize Safari ou Chrome e uma ligação à Internet.</p>
      <p class="error" id="error" role="alert"></p>
    </div>
  </main>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./assets/target.mind; autoStart: false; uiScanning: true; maxTrack: 1"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- O alvo tem largura 1 e altura proporcional à imagem original (1372/1920). -->
    <a-entity mindar-image-target="targetIndex: 0" id="imageTarget">
      <!-- Estrelas decorativas que flutuam junto das personagens. -->
      <a-entity class="float-star" geometry="primitive: octahedron; radius: 0.035" material="color: #f5a623; emissive: #f5a623; emissiveIntensity: 0.25" position="-0.31 0.20 0.06" animation="property: position; to: -0.31 0.28 0.06; dir: alternate; dur: 1250; loop: true; easing: easeInOutSine"></a-entity>
      <a-entity class="float-star" geometry="primitive: octahedron; radius: 0.026" material="color: #f36f62; emissive: #f36f62; emissiveIntensity: 0.2" position="0.02 0.29 0.06" animation="property: position; to: 0.02 0.36 0.06; dir: alternate; dur: 950; loop: true; easing: easeInOutSine"></a-entity>
      <a-entity class="float-star" geometry="primitive: octahedron; radius: 0.032" material="color: #f5a623; emissive: #f5a623; emissiveIntensity: 0.25" position="0.34 0.17 0.06" animation="property: position; to: 0.34 0.25 0.06; dir: alternate; dur: 1450; loop: true; easing: easeInOutSine"></a-entity>

      <!-- Pequenos círculos pulsantes, inspirados nos pontos da ilustração. -->
      <a-sphere radius="0.018" color="#f6b84b" position="-0.43 -0.08 0.07" animation="property: scale; to: 1.8 1.8 1.8; dir: alternate; dur: 900; loop: true"></a-sphere>
      <a-sphere radius="0.015" color="#f27e72" position="0.17 -0.18 0.07" animation="property: scale; to: 2 2 2; dir: alternate; dur: 1100; loop: true"></a-sphere>
      <a-sphere radius="0.018" color="#f6b84b" position="0.43 -0.12 0.07" animation="property: scale; to: 1.7 1.7 1.7; dir: alternate; dur: 1000; loop: true"></a-sphere>

      <!-- Arcos de movimento junto aos saltos. -->
      <a-torus color="#f27e72" radius="0.055" radius-tubular="0.004" arc="210" position="-0.29 -0.27 0.07" rotation="0 0 -25" animation="property: rotation; to: 0 0 15; dir: alternate; dur: 1300; loop: true"></a-torus>
      <a-torus color="#f27e72" radius="0.06" radius-tubular="0.004" arc="210" position="0.30 -0.27 0.07" rotation="0 0 25" animation="property: rotation; to: 0 0 -15; dir: alternate; dur: 1150; loop: true"></a-torus>

      <!-- Confettis discretos com rotação e deslocação. -->
      <a-entity geometry="primitive: tetrahedron; radius: 0.018" material="color: #ef6b4c" position="-0.08 0.05 0.08" animation="property: rotation; to: 0 0 360; dur: 2600; loop: true; easing: linear"></a-entity>
      <a-entity geometry="primitive: tetrahedron; radius: 0.014" material="color: #e9b64e" position="0.23 0.02 0.08" animation="property: position; to: 0.23 0.10 0.08; dir: alternate; dur: 1000; loop: true"></a-entity>
      <a-entity geometry="primitive: tetrahedron; radius: 0.016" material="color: #ef6b4c" position="-0.43 0.05 0.08" animation="property: rotation; to: 360 180 360; dur: 3200; loop: true; easing: linear"></a-entity>
    </a-entity>
  </a-scene>

  <script src="./js/ar.js"></script>
</body>
</html>
